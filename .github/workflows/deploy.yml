name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs migrate/deploy the same production environment at once.
# A migration must not be cancelled halfway through because a newer push arrived.
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TZ: Asia/Bangkok

jobs:
  test:
    runs-on: ubuntu-latest
    # prisma.config.ts builds its datasource URL from these at module-load
    # time — the --url isn't used here, so these must be set before Prisma
    # commands run at all.
    env:
      DB_HOST: localhost
      DB_PORT: 5437
      DB_DATABASE: tangpainai_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tangpainai_test
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @line/bot-sdk and @prisma/streams-local both declare engines.node
          # >=22 — Node 20 installs with EBADENGINE warnings and can fail npm
          # ci outright on lockfile drift.
          node-version: 22
          cache: npm
      # This lockfile was last generated on Windows, so it's missing the
      # Linux optional-dependency entries (native bindings, @emnapi/*) `npm
      # ci` demands for the runner's platform — same issue the Dockerfile
      # works around. `npm install` re-resolves those instead of hard-failing.
      - run: npm install
      - run: npx prisma generate
      # Applies the committed migration history to a fresh test DB. This never
      # touches production and validates the complete migration chain on PRs.
      - run: npx prisma migrate deploy
      # tsc's `include` covers .next/types/**, generated by a build/dev run —
      # generate those route types before checking TypeScript.
      - run: npx next typegen
      - run: npx tsc --noEmit

  # Compare the candidate with the last successfully deployed production SHA,
  # not only the latest push. If an earlier deploy failed, its migration stays
  # in this range and cannot accidentally bypass approval on the next push.
  detect-migrations:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      migration_changed: ${{ steps.detect.outputs.migration_changed }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migrations since the last successful deploy
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEAD_SHA="$GITHUB_SHA"
          EMPTY_TREE="$(git hash-object -t tree /dev/null)"
          BASE_SHA=""

          # A successful job using the `production` Environment creates a
          # Deployment record. Walk newest-first until a successful one is
          # found; failed/cancelled deploys must not advance the baseline.
          while IFS=$'\t' read -r DEPLOYMENT_ID DEPLOYMENT_SHA; do
            [ -n "$DEPLOYMENT_ID" ] || continue
            STATUS="$(gh api \
              "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses?per_page=1" \
              --jq '.[0].state // ""')"
            if [ "$STATUS" = "success" ]; then
              BASE_SHA="$DEPLOYMENT_SHA"
              break
            fi
          done < <(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/deployments?environment=production&ref=main&per_page=100" \
            --jq '.[] | [.id, .sha] | @tsv')

          if [ -z "$BASE_SHA" ]; then
            # First run with this workflow: fail safe by treating all existing
            # migrations as new, so one approval establishes the baseline.
            BASE_SHA="$EMPTY_TREE"
            BASE_LABEL="empty tree (first production baseline)"
          else
            BASE_LABEL="$BASE_SHA"
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA" || true
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::warning::Previous production SHA is unavailable; requiring approval for all migrations."
              BASE_SHA="$EMPTY_TREE"
              BASE_LABEL="empty tree (previous SHA unavailable)"
            fi
          fi

          CHANGES="$(git diff --name-status --find-renames "$BASE_SHA" "$HEAD_SHA" -- prisma/migrations/)"
          if [ -n "$CHANGES" ]; then
            MIGRATION_CHANGED=true
          else
            MIGRATION_CHANGED=false
          fi

          echo "migration_changed=$MIGRATION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "### Prisma migration check"
            echo ""
            echo "- Baseline: \`$BASE_LABEL\`"
            echo "- Candidate: \`$HEAD_SHA\`"
            echo "- Approval required: **$MIGRATION_CHANGED**"
            echo ""
            if [ -n "$CHANGES" ]; then
              echo '```text'
              echo "$CHANGES"
              echo '```'
            else
              echo "No changes under \`prisma/migrations/\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: [test, detect-migrations]
    # PR runs only gate on tests. Manual production deployment is allowed from
    # main only; a dispatch from any other ref cannot push or deploy an image.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs['detect-migrations'].result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR (and OCI registries generally) require lowercase repository names.
      - name: Lowercase the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_* is compiled into the client bundle at build time.
          build-args: |
            NEXT_PUBLIC_LIFF_ID=${{ vars.NEXT_PUBLIC_LIFF_ID }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:latest-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # This job exists only when migration files differ from the last successful
  # production deployment. Its Environment is configured with required
  # reviewer WorapongWonglamduan, so GitHub pauses here for approval. With no
  # migration change the whole job (and therefore the approval gate) is skipped.
  migrate-db:
    needs: [detect-migrations, build-and-push]
    if: >-
      always() &&
      needs['detect-migrations'].result == 'success' &&
      needs['build-and-push'].result == 'success' &&
      needs['detect-migrations'].outputs.migration_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-db-migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate

      # Postgres is loopback-only on the server, so the runner reaches it
      # through Tailscale and an SSH local-forward.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Open SSH tunnel to the server's Postgres
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -f -N \
            -L 5433:127.0.0.1:5437 \
            -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_SSH_USER }}@${{ secrets.SERVER_HOST }}
          sleep 3

      - name: Apply approved migrations
        run: npx prisma migrate deploy
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_DATABASE: ${{ secrets.SERVER_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.SERVER_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.SERVER_DB_PASSWORD }}

  deploy:
    needs: [detect-migrations, build-and-push, migrate-db]
    # `always()` is required because migrate-db is intentionally skipped when
    # there is no migration. Deploy only after the expected branch of this
    # truth table succeeds; a rejected/failed migration blocks deployment.
    if: >-
      always() &&
      needs['detect-migrations'].result == 'success' &&
      needs['build-and-push'].result == 'success' &&
      (
        (needs['detect-migrations'].outputs.migration_changed == 'true' &&
         needs['migrate-db'].result == 'success') ||
        (needs['detect-migrations'].outputs.migration_changed == 'false' &&
         needs['migrate-db'].result == 'skipped')
      )
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      # The server also pulls repository changes so docker-compose.yml changes
      # ship together with the image.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.SERVER_APP_DIR }}
            git pull
            docker compose pull app
            docker compose up -d app
            docker image prune -f

  notify:
    needs: [test, detect-migrations, build-and-push, migrate-db, deploy]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIGRATION_CHANGED: ${{ needs['detect-migrations'].outputs.migration_changed }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi

          REPO="${{ github.event.repository.name }}"

          if [ "${{ needs.test.result }}" != "success" ]; then
            TITLE="[$REPO] Test ล้มเหลว"; COLOR=15158332
          elif [ "${{ needs['detect-migrations'].result }}" != "success" ]; then
            TITLE="[$REPO] ตรวจ migration ล้มเหลว"; COLOR=15158332
          elif [ "${{ needs['build-and-push'].result }}" != "success" ]; then
            TITLE="[$REPO] Build/push image ล้มเหลว"; COLOR=15158332
          elif [ "$MIGRATION_CHANGED" = "true" ] && [ "${{ needs['migrate-db'].result }}" != "success" ]; then
            TITLE="[$REPO] Migrate DB ไม่สำเร็จ"; COLOR=15158332
          elif [ "$MIGRATION_CHANGED" = "false" ] && [ "${{ needs['migrate-db'].result }}" != "skipped" ]; then
            TITLE="[$REPO] สถานะ migration ผิดปกติ"; COLOR=15158332
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            TITLE="[$REPO] Deploy ล้มเหลว"; COLOR=15158332
          else
            TITLE="[$REPO] Deploy สำเร็จ"; COLOR=3066993
          fi

          if [ "$MIGRATION_CHANGED" = "false" ]; then
            MIGRATION_NOTE="ไม่มี migration — ข้าม approval"
          elif [ "${{ needs['migrate-db'].result }}" = "success" ]; then
            MIGRATION_NOTE="ตรวจพบ migration — อนุมัติและนำไปใช้สำเร็จ"
          else
            MIGRATION_NOTE="ตรวจพบ migration — ยังไม่ได้นำไปใช้"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "**commit:** [\`${{ github.sha }}\`]($COMMIT_URL)
          **migration:** $MIGRATION_NOTE
          **by:** ${{ github.actor }}
          [ดู log]($RUN_URL)" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, color: $color}]}')

          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK"
